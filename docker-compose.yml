services:
  backend:
    build:
      context: ./backend/src/Inflame-Backend/Inflame-Backend
      dockerfile: Dockerfile
    ports:
      - "5282:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    restart: always

  public-website:
    build:
      context: ./frontend/src/Public-Website
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - BACKEND_URL=http://backend:8080
    depends_on:
      - backend
    restart: always

  admin-website:
    build:
      context: ./frontend/src/Admin-Website
      dockerfile: Dockerfile
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=production
      - BACKEND_URL=http://backend:8080
    depends_on:
      - backend
    restart: always
