name: Backend Unit Tests

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./backend/src/Inflame-Backend

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x' 

    - name: Restore dependencies
      run: dotnet restore Inflame-Backend.Tests/Inflame-Backend.Tests.csproj

    - name: Build
      run: dotnet build Inflame-Backend.Tests/Inflame-Backend.Tests.csproj --configuration Release --no-restore

    - name: Test
      run: dotnet test Inflame-Backend.Tests/Inflame-Backend.Tests.csproj --configuration Release --no-build --verbosity normal
