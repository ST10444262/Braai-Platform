name: Backend CI – Build & Test

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

env:
  DOTNET_VERSION: '10.0.x'
  SOLUTION_PATH: 'backend/src/Inflame-Backend/Inflame-Backend.slnx'
  TEST_PROJECT_PATH: 'backend/src/Inflame-Backend/Inflame-Backend.Tests/Inflame-Backend.Tests.csproj'

jobs:
  build-and-test:
    name: Build & Test (.NET 10)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore ${{ env.SOLUTION_PATH }}

      - name: Build solution
        run: dotnet build ${{ env.SOLUTION_PATH }} --no-restore --configuration Release

      - name: Run unit tests with coverage
        run: |
          dotnet test ${{ env.TEST_PROJECT_PATH }} \
            --no-build \
            --configuration Release \
            --logger "trx;LogFileName=test-results.trx" \
            --logger "console;verbosity=normal" \
            --collect:"XPlat Code Coverage" \
            --results-directory ./TestResults

      - name: Publish test results to PR / Actions summary
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: xUnit Test Results
          path: '**/TestResults/test-results.trx'
          reporter: dotnet-trx
          fail-on-error: true

      - name: Generate HTML coverage report
        if: always()
        run: |
          dotnet tool install --global dotnet-reportgenerator-globaltool || true
          reportgenerator \
            -reports:"TestResults/**/coverage.cobertura.xml" \
            -targetdir:"TestResults/CoverageReport" \
            -reporttypes:"HtmlSummary;Cobertura;Badges"

      - name: Upload test & coverage artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-and-coverage-${{ github.run_number }}
          path: TestResults/
          retention-days: 14

  deploy:
    name: Deploy to Render
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Render Deploy Hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::warning::RENDER_DEPLOY_HOOK_URL secret is not configured in repository settings. Set this secret to enable automatic deployment from Actions."
            exit 0
          fi
          echo "Triggering deployment on Render..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$RENDER_DEPLOY_HOOK_URL")
          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "Deployment successfully triggered (HTTP $HTTP_STATUS)."
          else
            echo "Deployment trigger failed with HTTP $HTTP_STATUS."
            exit 1
          fi

      - name: Verify Database Health Check Post-Deploy
        env:
          BACKEND_URL: ${{ secrets.RENDER_BACKEND_URL || 'https://inflame-backend.onrender.com' }}
        run: |
          echo "Waiting for backend service to stabilize (20s)..."
          sleep 20
          echo "Pinging health check endpoint at $BACKEND_URL/api/public/health..."
          RESPONSE=$(curl -s -w "\n%{http_code}" "$BACKEND_URL/api/public/health" || true)
          BODY=$(echo "$RESPONSE" | sed '$d')
          STATUS=$(echo "$RESPONSE" | tail -n 1)
          echo "Response HTTP Status: $STATUS"
          echo "Response Body: $BODY"
          if [ "$STATUS" = "200" ]; then
            echo "Health check succeeded: Backend and database are healthy."
          else
            echo "::warning::Health check returned status $STATUS. The service may still be warming up or restarting on Render."
          fi